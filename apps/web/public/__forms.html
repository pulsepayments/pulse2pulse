<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Static skeleton so Netlify Forms registers the JS-rendered waitlist form. Field names must match WaitlistForm.tsx exactly. -->
<form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="waitlist">
  <input name="bot-field">
  <input name="name">
  <input name="email" type="email">
  <select name="role"><option value="sender">sender</option></select>
  <select name="size"><option value="">-</option></select>
  <select name="route"><option value="">-</option></select>
  <input name="company">
  <input type="checkbox" name="consent" value="yes">
</form>
</body></html>
